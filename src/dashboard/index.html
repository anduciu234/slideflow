<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Slideflow</title>
<style>
  :root {
    --bg: #f5f5f7; --sidebar: rgba(236,236,240,.72); --card: #ffffff; --fill: rgba(118,118,128,.12); --fill2: rgba(118,118,128,.08);
    --sep: rgba(60,60,67,.14); --text: #1d1d1f; --text2: #6e6e73; --text3: #a1a1a6;
    --blue: #0071e3; --blue-h: #0077ed; --green: #34c759; --orange: #ff9f0a; --red: #ff3b30;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05); --shadow-lg: 0 24px 60px rgba(0,0,0,.18);
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --sidebar: rgba(28,28,30,.72); --card: #1c1c1e; --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.14);
      --sep: rgba(84,84,88,.6); --text: #f5f5f7; --text2: #98989d; --text3: #636366;
      --blue: #0a84ff; --blue-h: #409cff; --green: #30d158; --orange: #ff9f0a; --red: #ff453a;
      --shadow: none; --shadow-lg: 0 24px 60px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.43 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; letter-spacing: -.008em; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  a { color: var(--blue); text-decoration: none; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  .shell { display: grid; grid-template-columns: 248px 1fr; height: 100vh; }
  /* sidebar: translucent, like macOS */
  aside { background: var(--sidebar); backdrop-filter: saturate(180%) blur(30px); -webkit-backdrop-filter: saturate(180%) blur(30px); border-right: 1px solid var(--sep); padding: 18px 10px; display: flex; flex-direction: column; gap: 2px; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 4px 10px 20px; font-weight: 600; font-size: 15px; letter-spacing: -.02em; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .group { color: var(--text3); font-size: 11px; font-weight: 600; letter-spacing: .02em; padding: 10px 10px 6px; }
  .nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 10px; border: 0; background: none; border-radius: 8px; text-align: left; cursor: default; }
  .nav:hover { background: var(--fill2); }
  .nav.on { background: var(--fill); font-weight: 600; }
  .nav img, .nav .ph { width: 22px; height: 22px; border-radius: 6px; object-fit: cover; flex: none; background: var(--fill); }
  .nav .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav .badge { font-size: 11px; color: var(--text2); background: var(--fill); border-radius: 10px; padding: 0 7px; line-height: 18px; }
  .nav.add { color: var(--blue); }
  .nav.add .ph { background: none; display: grid; place-items: center; }
  .foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--text2); line-height: 1.5; }

  main { overflow-y: auto; }
  .page { max-width: 1040px; margin: 0 auto; padding: 34px 40px 90px; }
  .title { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .title img, .title .ph { width: 56px; height: 56px; border-radius: 13px; object-fit: cover; background: var(--fill); box-shadow: 0 0 0 .5px var(--sep); }
  .title h1 { font-size: 30px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; }
  .title p { color: var(--text2); margin-top: 4px; font-size: 14px; }

  /* segmented control */
  .seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-bottom: 28px; }
  .seg button { border: 0; background: none; padding: 5px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--text); cursor: default; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); }
  @media (prefers-color-scheme: dark) { .seg button.on { background: #636366; } }

  h2 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 12px; display: flex; align-items: baseline; gap: 12px; }
  h2 .sub { font-size: 13px; color: var(--text2); font-weight: 400; letter-spacing: 0; }
  h2 .sp { flex: 1; }
  .sec { margin-bottom: 40px; }
  .muted { color: var(--text2); }
  .small { font-size: 12px; }

  .card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }
  @media (prefers-color-scheme: dark) { .card { box-shadow: 0 0 0 .5px var(--sep) inset; } }

  /* inset grouped list */
  .list { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  @media (prefers-color-scheme: dark) { .list { box-shadow: 0 0 0 .5px var(--sep) inset; } }
  .li { display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 52px; position: relative; }
  .li + .li::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
  .li .main { flex: 1; min-width: 0; }
  .li .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li .s { color: var(--text2); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .li img.th { width: 34px; height: 44px; border-radius: 6px; object-fit: cover; flex: none; background: var(--fill); }
  .li .tm { width: 54px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .li.open { color: var(--text3); }
  .li-head { color: var(--text2); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; margin: 20px 16px 7px; }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
  .dot.o { background: var(--orange); } .dot.r { background: var(--red); } .dot.n { background: var(--text3); }

  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--blue); color: #fff; border: 0; border-radius: 980px; padding: 7px 16px; font-size: 13px; font-weight: 500; cursor: default; white-space: nowrap; }
  .btn:hover { background: var(--blue-h); }
  .btn:disabled { opacity: .35; }
  .btn.gray { background: var(--fill); color: var(--text); }
  .btn.gray:hover { background: var(--fill); filter: brightness(.96); }
  .btn.plain { background: none; color: var(--blue); padding: 7px 6px; }
  .btn.sm { padding: 5px 12px; font-size: 12.5px; }
  .btn.ok { background: rgba(52,199,89,.14); color: var(--green); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kpi { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 18px; }
  @media (prefers-color-scheme: dark) { .kpi { box-shadow: 0 0 0 .5px var(--sep) inset; } }
  .kpi .l { color: var(--text2); font-size: 12.5px; }
  .kpi .v { font-size: 26px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 2px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .ss { padding: 14px; }
  .slides { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 14px; }
  .slides img { width: 100%; border-radius: 8px; display: block; object-fit: cover; background: var(--fill); }
  .ss .t { font-weight: 600; font-size: 15px; letter-spacing: -.015em; margin-bottom: 3px; }
  .ss .m { color: var(--text2); font-size: 12.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .tag { font-size: 11.5px; font-weight: 500; color: var(--text2); }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--fill); color: var(--text2); }
  .pill.g { background: rgba(52,199,89,.14); color: var(--green); }
  .pill.o { background: rgba(255,159,10,.14); color: var(--orange); }

  /* forms */
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--text2); }
  input[type=text], input[type=url], input[type=datetime-local], select, textarea { width: 100%; background: var(--card); color: var(--text); border: .5px solid var(--sep); box-shadow: inset 0 0 0 .5px var(--sep); border-radius: 8px; padding: 8px 10px; font-size: 14px; outline: none; }
  @media (prefers-color-scheme: dark) { input[type=text], input[type=url], input[type=datetime-local], select, textarea { background: var(--fill2); } }
  input:focus, select:focus, textarea:focus { box-shadow: 0 0 0 3.5px rgba(0,113,227,.28); border-color: var(--blue); }
  textarea { min-height: 76px; resize: vertical; line-height: 1.45; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form .full { grid-column: 1 / -1; }
  .check { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--text); }
  .check.dis { opacity: .4; }
  input[type=checkbox] { accent-color: var(--blue); width: 16px; height: 16px; }
  /* iOS switch */
  .switch { position: relative; width: 42px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; background: var(--fill); border-radius: 26px; transition: background .2s; }
  .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; background: #fff; border-radius: 50%; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
  .switch input:checked + span { background: var(--green); }
  .switch input:checked + span::after { transform: translateX(16px); }

  .posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
  .post { display: block; color: inherit; }
  .post img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; display: block; background: var(--fill); }
  .post .s { font-size: 12px; color: var(--text2); padding: 6px 2px; }
  .post .s b { color: var(--text); font-weight: 600; font-size: 13px; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 80px; margin: 18px 0 8px; }
  .chart i { flex: 1; background: var(--fill); border-radius: 3px 3px 0 0; min-height: 3px; }
  .chart i.us { background: var(--blue); }

  .empty { color: var(--text2); text-align: center; padding: 44px 16px; }
  .empty b { color: var(--text); }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; }
  .compare .lbl { font-size: 12px; color: var(--text2); margin-bottom: 7px; font-weight: 500; }
  .compare img.sheet { width: 100%; border-radius: 10px; display: block; }

  .note { background: var(--fill2); border-radius: 10px; padding: 10px 12px; color: var(--text2); font-size: 12.5px; line-height: 1.5; }

  /* sheet (modal) */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: none; align-items: flex-start; justify-content: center; padding: 48px 16px; overflow-y: auto; z-index: 40; }
  .scrim.on { display: flex; }
  .sheet { background: var(--card); border-radius: 16px; width: 100%; max-width: 620px; box-shadow: var(--shadow-lg); overflow: hidden; }
  .sheet .hd { padding: 18px 22px 12px; }
  .sheet .hd h3 { font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
  .sheet .bd { padding: 4px 22px 18px; }
  .sheet .ft { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: .5px solid var(--sep); background: var(--fill2); }
  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 14px; }
  .strip img { height: 140px; border-radius: 8px; }
  .legal { font-size: 12px; color: var(--text2); line-height: 1.5; }
  hr { border: 0; border-top: .5px solid var(--sep); margin: 16px 0; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: rgba(30,30,32,.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; backdrop-filter: blur(20px); transition: all .25s; pointer-events: none; z-index: 60; max-width: 90vw; }
  .toast.on { opacity: 1; transform: translateX(-50%); }
  .toast.err { background: var(--red); }
  @media (max-width: 780px) { .shell { grid-template-columns: 1fr; } aside { display: none; } .page { padding: 22px 16px 70px; } .form, .compare { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><img src="/logo.png" onerror="this.remove()" alt="">Slideflow</div>
    <div class="group">Apps</div>
    <div id="appList"></div>
    <button class="nav add" id="addApp"><span class="ph"><svg class="i" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></span><span class="n">Add App</span></button>
    <div class="foot" id="foot"></div>
  </aside>
  <main><div class="page" id="view"><div class="empty">Loading…</div></div></main>
</div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => n == null ? "—" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? Math.round(n / 1e3) + "K" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n);
const file = (p) => p ? "/file?p=" + encodeURIComponent(p) : "";
const img = (u) => !u ? "" : /^https?:/.test(u) ? (/tiktokcdn|mzstatic/.test(u) ? "/img?u=" + encodeURIComponent(u) : u) : file(u);
const icon = (a, cls = "") => a?.icon ? `<img class="${cls}" src="${esc(img(a.icon))}" alt="">` : `<span class="ph ${cls}"></span>`;
const ratio = (d) => d.aspect === "3:4" ? "3/4" : "9/16";
function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = "toast on" + (err ? " err" : ""); clearTimeout(t._h); t._h = setTimeout(() => t.className = "toast", 3400); }
async function api(url, data) {
  const r = await fetch(url, data === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}
const state = { apps: [], slug: null, tab: "overview", view: null };
try { Object.assign(state, JSON.parse(localStorage.getItem("sf") || "{}")); } catch {}
const persist = () => { try { localStorage.setItem("sf", JSON.stringify({ slug: state.slug, tab: state.tab })); } catch {} };
const tz = () => state.view?.timezone || "Europe/London";
const when = (iso) => {
  const d = new Date(iso), now = new Date(), day = (x) => x.toLocaleDateString("en-GB", { timeZone: tz() });
  const t = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: tz() });
  if (day(d) === day(now)) return `Today ${t}`;
  if (day(d) === day(new Date(now.getTime() + 864e5))) return `Tomorrow ${t}`;
  return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: tz() }) + ", " + t;
};
const status = (q) => q.status === "queued" ? ["", `Scheduled · ${when(q.at || q.scheduledAt)}`] : q.status === "done" ? ["", q.mode === "draft" ? "In TikTok inbox" : "Posted"] : q.status === "failed" ? ["r", "Failed" + (q.error ? ` · ${q.error.slice(0, 60)}` : "")] : q.status === "cancelled" ? ["n", "Cancelled"] : ["o", q.status === "processing" ? "Processing" : "Uploading"];

// ---------- sidebar ----------
async function loadApps() {
  const j = await api("/api/apps"); state.apps = j.apps;
  if (!state.apps.find((a) => a.slug === state.slug)) state.slug = state.apps[0]?.slug ?? null;
  $("#appList").innerHTML = state.apps.map((a) => `<button class="nav ${a.slug === state.slug ? "on" : ""}" data-app="${esc(a.slug)}">${icon(a)}<span class="n">${esc(a.name.split(":")[0])}</span>${a.upcoming ? `<span class="badge">${a.upcoming}</span>` : ""}</button>`).join("");
  $("#foot").innerHTML = `Research this month<br><span style="color:var(--text)">$${j.spend.estUsd.toFixed(2)}</span> · ${j.spend.runs} runs`;
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-app]"); if (a) { state.slug = a.dataset.app; state.tab = "overview"; persist(); refresh(); }
  const t = e.target.closest("[data-tab]"); if (t) { state.tab = t.dataset.tab; persist(); render(); }
  const z = e.target.closest(".slides img, img.sheet"); if (z) window.open(z.src, "_blank");
});
$("#addApp").onclick = () => openAddApp();

async function refresh() {
  await loadApps();
  if (!state.slug) { $("#view").innerHTML = `<div class="empty"><b>No apps yet</b><br><br><button class="btn" onclick="openAddApp()">Add Your First App</button></div>`; return; }
  state.view = await api("/api/app?slug=" + encodeURIComponent(state.slug));
  render();
}

const TABS = [["overview", "Overview"], ["slideshows", "Slideshows"], ["formats", "Formats"], ["schedule", "Schedule"], ["accounts", "Accounts"], ["profile", "Profile"]];
function render() {
  const a = state.view.app;
  $("#view").innerHTML = `
    <div class="title">${icon(a)}<div><h1>${esc(a.name.split(":")[0])}</h1><p>${esc(a.oneLiner || "Add a one-line description in Profile.")}</p></div></div>
    <div class="seg">${TABS.map(([k, l]) => `<button data-tab="${k}" class="${state.tab === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <div id="tab"></div>`;
  ({ overview, slideshows, formats, schedule, accounts, profile })[state.tab]();
}

function card(d) {
  const q = d.queue?.find((x) => x.status !== "cancelled");
  const [c, s] = q ? status(q) : [];
  return `<div class="card ss">
    <div class="slides">${d.previews.map((p) => `<img src="${file(p)}" style="aspect-ratio:${ratio(d)}" alt="">`).join("")}</div>
    <div class="t">${esc(d.title)}</div>
    <div class="m">${d.slides} slides${d.format ? ` · ${esc(d.format.replace(/-/g, " "))}` : ""}${q ? ` · <span class="dot ${c}"></span>${esc(s)}` : d.approved ? ` · <span class="dot"></span>Approved` : ""}</div>
    <div class="row"><button class="btn sm" data-post="${esc(d.id)}">Post…</button>
      <button class="btn sm ${d.approved ? "ok" : "gray"}" data-approve="${esc(d.id)}" data-v="${d.approved ? 0 : 1}">${d.approved ? "Approved" : "Approve"}</button></div>
  </div>`;
}
function bind(el) {
  el.querySelectorAll("[data-approve]").forEach((b) => b.onclick = async () => { try { await api(`/api/approve?draft=${b.dataset.approve}&v=${b.dataset.v}`, {}); await refresh(); } catch (e) { toast(e.message, 1); } });
  el.querySelectorAll("[data-post]").forEach((b) => b.onclick = () => openPost(b.dataset.post));
  el.querySelectorAll("[data-cancel]").forEach((b) => b.onclick = async () => { try { await api("/api/cancel?id=" + b.dataset.cancel, {}); await refresh(); toast("Cancelled"); } catch (e) { toast(e.message, 1); } });
}
const rowStatus = (title, thumb, c, s, extra = "") => `<div class="li"><img class="th" src="${file(thumb)}" alt=""><div class="main"><div class="t">${esc(title)}</div><div class="s"><span class="dot ${c}"></span>${esc(s)}</div></div>${extra}</div>`;

function overview() {
  const v = state.view, el = $("#tab");
  const stats = v.accounts.map((x) => x.stats).filter(Boolean), posts = stats.flatMap((s) => s.posts || []);
  const views = posts.reduce((n, p) => n + p.views, 0);
  const upcoming = Object.entries(v.schedule).flatMap(([acc, sl]) => sl.filter((s) => s.item).map((s) => ({ ...s, acc }))).slice(0, 6);
  const empty = Object.values(v.schedule).flat().filter((s) => !s.item).length;
  const waiting = v.drafts.filter((d) => d.approved && !d.queue.some((q) => q.status !== "cancelled")).length;
  el.innerHTML = `
    <div class="kpis sec">
      <div class="kpi"><div class="l">Followers</div><div class="v">${fmt(stats.reduce((n, s) => n + (s.profile?.followers || 0), 0))}</div></div>
      <div class="kpi"><div class="l">Views</div><div class="v">${fmt(views)}</div></div>
      <div class="kpi"><div class="l">Average per post</div><div class="v">${fmt(posts.length ? Math.round(views / posts.length) : null)}</div></div>
      <div class="kpi"><div class="l">Slideshows</div><div class="v">${v.drafts.length}</div></div>
    </div>
    <div class="sec"><h2>Up Next<span class="sub">${waiting} approved · ${empty} open slots</span><span class="sp"></span><button class="btn sm" id="scheduleAll" ${waiting ? "" : "disabled"}>Schedule Approved</button></h2>
      <div class="list">${upcoming.length ? upcoming.map((s) => rowStatus(s.item.draft.title, s.item.draft.previews[0], "", `${when(s.at)} · ${s.acc}`)).join("") : `<div class="empty">Nothing scheduled. Approve a slideshow, then choose <b>Schedule Approved</b>.</div>`}</div></div>
    ${v.recent.length ? `<div class="sec"><h2>Recent</h2><div class="list">${v.recent.map((q) => { const [c, s] = status(q); return rowStatus(q.draft.title, q.draft.previews[0], c, `${s} · ${q.account}`); }).join("")}</div></div>` : ""}
    <div class="sec"><h2>Latest Slideshows</h2><div class="cards">${v.drafts.slice(0, 3).map(card).join("") || `<div class="card empty">No slideshows yet.</div>`}</div></div>`;
  bind(el);

  $("#connect").onclick = async () => {

// Post screen built to TikTok's Content Sharing Guidelines (required for the Direct Post audit).
const PRIV = { PUBLIC_TO_EVERYONE: "Everyone", MUTUAL_FOLLOW_FRIENDS: "Friends", FOLLOWER_OF_CREATOR: "Followers", SELF_ONLY: "Only me" };
async function openPost(draftId) {
  const v = state.view, d = v.drafts.find((x) => x.id === draftId);
  if (!v.accounts.length) return toast("Add a TikTok account to this app first", 1);
  openSheet(`<div class="hd"><h3>Post to TikTok</h3><div class="row muted small" style="margin-top:6px"><select id="pAcc" style="width:auto;padding:4px 8px;font-size:13px">${v.accounts.map((a) => `<option>${esc(a.name)}</option>`).join("")}</select><span id="pCreator">Loading account…</span></div></div>
    <div class="bd">
      <div class="strip">${d.renders.map((p) => `<img src="${file(p)}" alt="">`).join("")}</div>
      <div class="form">
        <label class="field full">Title<input type="text" id="pTitle" maxlength="90" value="${esc(d.title)}"></label>
        <label class="field full">Caption<textarea id="pCap" maxlength="4000">${esc(d.caption)}</textarea></label>
        <label class="field">Post as<select id="pMode"><option value="draft">Draft in TikTok inbox</option><option value="direct">Direct post</option></select></label>
        <label class="field">When<select id="pWhenType"><option value="now">Now</option><option value="at">Later…</option></select></label>
        <label class="field full" id="pAtWrap" style="display:none">Date and time<input type="datetime-local" id="pAt"></label>
      </div>
      <div id="pDirect" style="display:none"><hr>
        <div class="form">
          <label class="field">Who can view this post<select id="pPriv"><option value="" selected disabled>Select</option></select></label>
          <div style="display:flex;align-items:flex-end;padding-bottom:9px"><label class="check" id="pComWrap"><input type="checkbox" id="pCom"> Allow comments</label></div>
        </div>
        <hr>
        <div class="row" style="justify-content:space-between"><div><div style="font-weight:500">Disclose commercial content</div><div class="muted small" style="max-width:440px">Turn on to disclose that this content promotes goods or services in exchange for something of value. You need to indicate if your content promotes yourself, a third party, or both.</div></div><label class="switch"><input type="checkbox" id="pComm"><span></span></label></div>
        <div id="pCommOpts" style="display:none;margin-top:12px">
          <label class="check"><input type="checkbox" id="pYour"> Your brand <span class="muted small">You're promoting yourself or your own business</span></label>
          <label class="check" style="margin-top:8px" id="pBrandWrap"><input type="checkbox" id="pBrand"> Branded content <span class="muted small">You're promoting another brand or a third party</span></label>
          <div class="note" id="pLabel" style="margin-top:10px;display:none"></div>
        </div>
      </div>
      <hr>
      <div class="note" id="pInboxNote">TikTok sends this to your inbox. Open the notification to add a sound and publish. Up to 5 pending drafts per 24 hours.</div>
      <div class="note" id="pDirectNote" style="display:none">After you post, it can take a few minutes to process and appear on your profile. Until the app passes TikTok's audit, direct posts are visible only to you.</div>
      <p class="legal" id="pLegal" style="margin-top:12px"></p>
    </div>
    <div class="ft"><button class="btn gray" id="pCancel">Cancel</button><button class="btn" id="pGo">Send to Inbox</button></div>`);
  const s = (id) => $("#" + id);
  let creator = null;
  async function loadCreator() {
    s("pCreator").textContent = "Loading account…";
    try {
      creator = await api("/api/creator?account=" + encodeURIComponent(s("pAcc").value));
      s("pCreator").innerHTML = `Posting to <b style="color:var(--text)">${esc(creator.creator_nickname)}</b> @${esc(creator.creator_username)}`;
      s("pPriv").innerHTML = `<option value="" selected disabled>Select</option>` + creator.privacy_level_options.map((o) => `<option value="${o}">${PRIV[o] || o}</option>`).join("");
      s("pCom").disabled = !!creator.comment_disabled; s("pComWrap").classList.toggle("dis", !!creator.comment_disabled);
    } catch (e) {
      creator = null; // Guidelines 1b: stop and ask the user to try later
      s("pCreator").innerHTML = `<span style="color:var(--red)">This account can't post right now. Try again later. (${esc(e.message)})</span>`;
    }
    update();
  }
  function update() {
    const direct = s("pMode").value === "direct", at = s("pWhenType").value === "at";
    s("pDirect").style.display = direct ? "block" : "none";
    s("pInboxNote").style.display = direct ? "none" : "block"; s("pDirectNote").style.display = direct ? "block" : "none";
    s("pAtWrap").style.display = at ? "block" : "none";
    const comm = s("pComm").checked, your = s("pYour").checked, brand = s("pBrand").checked, priv = s("pPriv").value;
    s("pCommOpts").style.display = comm ? "block" : "none";
    const onlyMe = s("pPriv").querySelector('option[value="SELF_ONLY"]');
    if (onlyMe) { onlyMe.disabled = comm && brand; onlyMe.title = comm && brand ? "Branded content visibility cannot be set to private." : ""; }
    s("pBrand").disabled = priv === "SELF_ONLY"; s("pBrandWrap").classList.toggle("dis", priv === "SELF_ONLY"); s("pBrandWrap").title = priv === "SELF_ONLY" ? "Branded content visibility cannot be set to private." : "";
    const lab = s("pLabel");
    if (comm && (your || brand)) { lab.style.display = "block"; lab.textContent = brand ? "Your photo/video will be labeled as 'Paid partnership'" : "Your photo/video will be labeled as 'Promotional content'"; } else lab.style.display = "none";
    const MUC = `<a href="https://www.tiktok.com/legal/page/global/music-usage-confirmation/en" target="_blank" rel="noopener">Music Usage Confirmation</a>`;
    const BCP = `<a href="https://www.tiktok.com/legal/page/global/bc-policy/en" target="_blank" rel="noopener">Branded Content Policy</a>`;
    s("pLegal").innerHTML = direct && comm && brand ? `By posting, you agree to TikTok's ${BCP} and ${MUC}.` : `By posting, you agree to TikTok's ${MUC}.`;
    let ok = !!creator;
    if (direct) ok = ok && !!priv && (!comm || your || brand);
    if (at) ok = ok && !!s("pAt").value;
    s("pGo").disabled = !ok;
    s("pGo").textContent = at ? "Schedule" : direct ? "Post" : "Send to Inbox";
    s("pGo").title = direct && comm && !your && !brand ? "You need to indicate if your content promotes yourself, a third party, or both." : "";
  }
  ["pMode", "pWhenType", "pPriv", "pComm", "pYour", "pBrand", "pAt"].forEach((id) => s(id).addEventListener("change", update));
  s("pAcc").onchange = loadCreator; s("pCancel").onclick = closeSheet;
  s("pGo").onclick = async () => {
    s("pGo").disabled = true;
    const direct = s("pMode").value === "direct", at = s("pWhenType").value === "at";
    try {
      const r = await api("/api/post", { consent: true, draftId, account: s("pAcc").value, mode: direct ? "direct" : "draft", at: at ? new Date(s("pAt").value).toISOString() : null,
        title: s("pTitle").value, caption: s("pCap").value, privacy: direct ? s("pPriv").value : null, allowComment: direct && s("pCom").checked,
        commercial: direct && s("pComm").checked, brandOrganic: s("pYour").checked, brandedContent: s("pBrand").checked });
      closeSheet();
      if (at) { toast(`Scheduled for ${when(r.scheduledAt)}`); await refresh(); return; }
      if (r.status === "failed") { toast("Failed: " + r.error, 1); await refresh(); return; }
      toast(direct ? "Uploading. It can take a few minutes to appear on your profile" : "Uploading to TikTok…");
      pollStatus(r.id);
    } catch (e) { toast(e.message, 1); s("pGo").disabled = false; }
  };
  loadCreator();
}

async function pollStatus(id) {
  for (let i = 0; i < 24; i++) {
    await new Promise((r) => setTimeout(r, 5000));
    try {
      const q = await api("/api/status?id=" + encodeURIComponent(id));
      if (q.status === "done") { toast(q.tiktokStatus === "SEND_TO_USER_INBOX" ? "In your TikTok inbox. Open it to add a sound and publish" : "Posted. It can take a few minutes to show on your profile"); break; }
      if (q.status === "failed") { toast("TikTok rejected it: " + (q.error || q.tiktokStatus || "unknown"), 1); break; }
    } catch (e) { toast(e.message, 1); break; }
  }
  await refresh();
}

refresh().catch((e) => { $("#view").innerHTML = `<div class="empty">Couldn't load: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
