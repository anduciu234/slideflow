<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;background:transparent}
</style></head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/><stop offset="1" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d6e"/><stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25e0d6"/><stop offset="1" stop-color="#2a7bff"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="0" fill="url(#bg)"/>
  <!-- back slide -->
  <g transform="rotate(-12 512 540)" filter="url(#sh)">
    <rect x="322" y="250" width="330" height="560" rx="44" fill="url(#card2)" opacity=".95"/>
  </g>
  <!-- front slide -->
  <g transform="rotate(8 512 540)" filter="url(#sh)">
    <rect x="382" y="230" width="340" height="580" rx="46" fill="url(#card)"/>
    <rect x="432" y="430" width="240" height="34" rx="17" fill="#fff"/>
    <rect x="462" y="488" width="180" height="34" rx="17" fill="#fff" opacity=".85"/>
    <!-- progress dots -->
    <circle cx="502" cy="740" r="11" fill="#fff"/>
    <circle cx="540" cy="740" r="11" fill="#fff" opacity=".5"/>
    <circle cx="578" cy="740" r="11" fill="#fff" opacity=".5"/>
    <circle cx="616" cy="740" r="11" fill="#fff" opacity=".5"/>
  </g>
</svg></body></html>
